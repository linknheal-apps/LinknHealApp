name: RLS Mutation Check

on:
  push:
    branches: [chore/mutation-check]

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mutation: [M1, M2, M2b, M3, M4, M5, M6, M7, M8]
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation ${{ matrix.mutation }}
        run: git apply .mutation/${{ matrix.mutation }}.patch
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase (synthetic data only)
        run: supabase start
      - name: Run pgTAP privacy tests (expect failure)
        run: |
          set +e
          supabase test db > out.txt 2>&1
          rc=$?
          cat out.txt
          echo "---- failing assertions ----"
          grep -E "not ok|Failed test" out.txt
          if [ $rc -eq 0 ]; then
            echo "::error::SURVIVED ${{ matrix.mutation }}"
            echo "SURVIVED ${{ matrix.mutation }}"
            exit 1
          elif grep -qE "^# Failed test|Result: FAIL" out.txt; then
            echo "KILLED ${{ matrix.mutation }}"
            exit 0
          else
            echo "::error::INVALID ${{ matrix.mutation }} (failed without a failing assertion)"
            exit 1
          fi
