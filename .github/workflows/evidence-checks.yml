name: Evidence checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan
        run: |
          fail=0

          bad=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked env file(s) found:"
            echo "$bad"
            fail=1
          fi

          client_paths=""
          for p in src index.html vite.config.ts capacitor.config.ts capacitor.config.json package.json; do
            [ -e "$p" ] && client_paths="$client_paths $p"
          done
          if [ -n "$client_paths" ]; then
            hits=$(grep -rnIiE 'service_role|SUPABASE_SERVICE' $client_paths || true)
            if [ -n "$hits" ]; then
              echo "::error::service_role reference in client code or client config:"
              echo "$hits"
              fail=1
            fi
          fi

          vite=$(git grep -nIiE 'VITE_[A-Z0-9_]*(SERVICE|SECRET|PRIVATE)' -- . ':!package-lock.json' || true)
          if [ -n "$vite" ]; then
            echo "::error::Secret-like VITE_ variable (shipped to the browser):"
            echo "$vite"
            fail=1
          fi

          fn=$(git grep -nIiE 'service_role|SUPABASE_SERVICE' -- supabase/functions 2>/dev/null || true)
          if [ -n "$fn" ]; then
            echo "::warning::service_role referenced in Edge Functions (review needed):"
            echo "$fn"
          fi

          jwt=$(git grep -nIE 'eyJ[A-Za-z0-9_-]{15,}\.eyJ[A-Za-z0-9_-]{15,}' -- . ':!package-lock.json' || true)
          if [ -n "$jwt" ]; then
            echo "::error::JWT-looking string committed:"
            echo "$jwt" | cut -c1-120
            fail=1
          fi

          exit $fail

      - name: Migration and test change review
        if: always()
        run: |
          fail=0
          base="origin/${BASE_REF:-main}"
          echo "Base: $base"
          if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            echo "::error::Base ref cannot be resolved: $base"
            exit 1
          fi

          touched=$(git diff --name-status "$base"...HEAD -- supabase/migrations | grep -vE '^A' || true)
          if [ -n "$touched" ]; then
            echo "::error::Existing migration modified/deleted/renamed (migrations are append-only):"
            echo "$touched"
            fail=1
          fi

          loose=$(git diff -U0 "$base"...HEAD -- supabase/migrations \
            | grep -E '^\+' | grep -vE '^\+\+\+' | grep -vE '^\+[[:space:]]*--' \
            | grep -iE 'using[[:space:]]*\([[:space:]]*true[[:space:]]*\)|with[[:space:]]+check[[:space:]]*\([[:space:]]*true[[:space:]]*\)|disable row level security|no force row level security|[[:space:]]to[[:space:]]+(anon|public)\b' || true)
          if [ -n "$loose" ]; then
            echo "::error::Permissive SQL added in a migration (review the policy):"
            echo "$loose"
            fail=1
          fi

          removed=$(git diff -U0 "$base"...HEAD -- supabase/tests \
            | grep -E '^-' | grep -vE '^---' \
            | grep -E '\b(ok|is|isnt|throws_ok|lives_ok|results_eq|is_empty|row_eq|policies_are)[[:space:]]*\(' || true)
          if [ -n "$removed" ]; then
            echo "::error::Test assertions removed or changed (check that none was weakened):"
            echo "$removed"
            fail=1
          fi

          {
            echo '## Changed files under supabase/'
            echo '```'
            git diff --name-status "$base"...HEAD -- supabase || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

  pgtap-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase (synthetic data only)
        run: supabase start
      - name: Run pgTAP and keep the raw log
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log
      - name: Put the key lines in the run summary
        if: always()
        run: |
          {
            echo '## pgTAP raw summary'
            echo '```'
            grep -E '^(Files=|Result:)|Failed test|Dubious' pgtap.log || echo 'no summary lines found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgtap-log
          path: pgtap.log
          retention-days: 14
